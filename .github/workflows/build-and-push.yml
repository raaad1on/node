name: Build & Push Docker Image

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  variants:
    name: Resolve variants
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.bake.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read variants from docker-bake.hcl
        id: bake
        run: |
          list=$(docker buildx bake --print 2>/dev/null | jq -c '.group.default.targets')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Variants: $list"

  build-docker-images:
    name: Build ${{ matrix.variant }} ${{ matrix.platform }}
    needs: [variants]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        variant: ${{ fromJson(needs.variants.outputs.list) }}
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        run: |
          docker buildx bake "${{ matrix.variant }}" \
            --set "*.platform=${{ matrix.platform }}" \
            --set "*.tags=" \
            --set '*.output=type=image,"name=ghcr.io/raaad1on/remnanode",push-by-digest=true,name-canonical=true,push=true' \
            --metadata-file "${{ runner.temp }}/metadata.json"

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest=$(jq -r '.["${{ matrix.variant }}"]["containerimage.digest"]' "${{ runner.temp }}/metadata.json")
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge & push manifests (${{ matrix.variant }})
    needs: [variants, build-docker-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.variants.outputs.list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest lists
        working-directory: ${{ runner.temp }}/digests
        run: |
          resolve() {
            TAG="$1" docker buildx bake --file "$GITHUB_WORKSPACE/docker-bake.hcl" \
              --print "${{ matrix.variant }}" 2>/dev/null \
              | jq -r --arg reg "$2:" '.target[].tags[] | select(startswith($reg))'
          }

          registry="ghcr.io/raaad1on/remnanode"
          tags=$( { resolve latest "$registry"; resolve "${{ github.ref_name }}" "$registry"; } \
            | sed 's/^/-t /' | tr '\n' ' ')

          echo "→ $registry: $tags"

          docker buildx imagetools create $tags \
            $(for digest in *; do echo "$registry@sha256:$digest"; done)

      - name: Inspect image
        run: docker buildx imagetools inspect $(TAG=${{ github.ref_name }} docker buildx bake --print "${{ matrix.variant }}" 2>/dev/null | jq -r '.target[].tags[0]')

  create-release:
    needs: [merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          body: |
            ## Custom Remnanode with Xray Blackhole Status Code

            Docker image with custom Xray build that supports `statusCode` in blackhole protocol.

            ### Docker Image
            ```bash
            docker pull ghcr.io/raaad1on/remnanode:${{ github.ref_name }}
            # or latest
            docker pull ghcr.io/raaad1on/remnanode:latest
            ```

            ### Usage Example
            ```json
            {
              "outbounds": [{
                "tag": "204",
                "protocol": "blackhole",
                "settings": {
                  "response": {
                    "type": "http",
                    "statusCode": 204
                  }
                }
              }]
            }
            ```
