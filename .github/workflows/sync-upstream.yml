name: Sync with Upstream

on:
  schedule:
    # Run daily at 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/remnawave/node.git || true
          git fetch upstream

      - name: Check for upstream updates
        id: check
        run: |
          UPSTREAM_MAIN=$(git rev-parse upstream/main)
          
          # Check if origin/main exists, if not use HEAD
          if git rev-parse origin/main >/dev/null 2>&1; then
            FORK_MAIN=$(git rev-parse origin/main)
          else
            FORK_MAIN=$(git rev-parse HEAD)
          fi
          
          echo "upstream_sha=$UPSTREAM_MAIN" >> $GITHUB_OUTPUT
          echo "fork_sha=$FORK_MAIN" >> $GITHUB_OUTPUT
          
          if [ "$UPSTREAM_MAIN" = "$FORK_MAIN" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "Fork is up to date with upstream"
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            COMMITS_BEHIND=$(git rev-list --count HEAD..upstream/main)
            echo "commits_behind=$COMMITS_BEHIND" >> $GITHUB_OUTPUT
            echo "Fork is $COMMITS_BEHIND commits behind upstream"
          fi

      - name: Get upstream version
        if: steps.check.outputs.has_updates == 'true'
        id: version
        run: |
          VERSION=$(git show upstream/main:package.json | jq -r '.version' || echo "unknown")
          echo "upstream_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create sync branch and check for conflicts
        if: steps.check.outputs.has_updates == 'true'
        id: merge
        run: |
          BRANCH_NAME="sync-upstream-$(date +%Y%m%d-%H%M%S)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          git checkout -b $BRANCH_NAME
          
          if git merge upstream/main --no-edit; then
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            echo "Merge successful without conflicts"
          else
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            echo "conflicted_files=$CONFLICTS" >> $GITHUB_OUTPUT
            git merge --abort
          fi

      - name: Push sync branch (no conflicts)
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.has_conflicts == 'false'
        run: |
          git push origin ${{ steps.merge.outputs.branch_name }}

      - name: Create PR (no conflicts)
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.has_conflicts == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.merge.outputs.branch_name }}
          base: main
          title: "⬆️ Sync with upstream remnawave/node v${{ steps.version.outputs.upstream_version }}"
          body: |
            ## Upstream Sync
            
            This PR syncs the fork with upstream remnawave/node.
            
            **Upstream version:** ${{ steps.version.outputs.upstream_version }}
            **Commits behind:** ${{ steps.check.outputs.commits_behind }}
            
            ### ⚠️ Before merging:
            1. Check if `docker/Dockerfile` changes don't override custom `UPSTREAM_REPO` setting
            2. Verify Xray version compatibility
            3. Run tests if needed
            
            [Compare changes](https://github.com/remnawave/node/compare/${{ steps.check.outputs.fork_sha }}...${{ steps.check.outputs.upstream_sha }})
            
            🤖 *Auto-generated by sync workflow*
          labels: |
            upstream-sync
            automated

      - name: Create conflict issue
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.has_conflicts == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const conflictedFiles = '${{ steps.merge.outputs.conflicted_files }}'.split(' ').filter(f => f).map(f => `- \`${f}\``).join('\n');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Upstream sync conflicts - manual resolution needed',
              body: `## Sync Conflict
            
            **Upstream version:** ${{ steps.version.outputs.upstream_version }}
            **Commits behind:** ${{ steps.check.outputs.commits_behind }}
            
            ### Conflicted files:
            ${conflictedFiles}
            
            ### Manual resolution:
            \`\`\`bash
            git remote add upstream https://github.com/remnawave/node.git || true
            git fetch upstream
            git checkout -b sync-upstream-manual
            git merge upstream/main
            # resolve conflicts
            git add .
            git commit -m "Merge upstream with conflict resolution"
            git push origin sync-upstream-manual
            \`\`\`
            
            🤖 *Auto-generated by sync workflow*`,
              labels: ['upstream-sync', 'conflicts']
            });

      - name: Summary
        run: |
          echo "## Sync Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.has_updates }}" = "true" ]; then
            echo "- **Updates:** ${{ steps.check.outputs.commits_behind }} commits behind" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.merge.outputs.has_conflicts }}" = "true" ]; then
              echo "- **Status:** ⚠️ Conflicts - issue created" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **Status:** ✅ PR created" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- **Status:** ✅ Up to date" >> $GITHUB_STEP_SUMMARY
          fi
